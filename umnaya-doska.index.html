<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Умная доска — интерактивная доска для уроков в начальной школе: математика, русский язык, саха тыла, рефлексия, таймер.">
<meta name="theme-color" content="#4DA3FF">
<title>Умная доска</title>
<style>
:root{
  --math:#4DA3FF; --ru:#2FBF64; --sakha:#0FB5AE; --refl:#F25FA8; --timer:#FF8F2E;
  --ink:#1f2937; --muted:#64748b; --ui:#ffffff; --line:#e2e8f0;
  --shadow:0 8px 28px rgba(30,41,59,.16);
  --font:"Segoe UI",Roboto,"Noto Sans","PT Sans","Helvetica Neue",Arial,sans-serif;
  --tc:#4DA3FF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:var(--font);color:var(--ink);
  overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
input,textarea,select{font-family:inherit;user-select:text;-webkit-user-select:text;touch-action:manipulation}
svg{display:block}
#board{position:fixed;inset:0;overflow:hidden}
#board canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#cvLive{cursor:crosshair}
#cvLive.c-select{cursor:default}
#cvLive.c-text{cursor:text}
#cvLive.c-eraser{cursor:none}
#textEd{position:absolute;display:none;margin:0;padding:0;border:2px dashed #3b82f6;border-radius:6px;outline:none;resize:none;overflow:hidden;
  background:rgba(255,255,255,.45);white-space:pre;line-height:1.25;min-width:40px;z-index:5;touch-action:auto}
.cellEdit{position:fixed;z-index:60;border:3px solid #3b82f6;border-radius:8px;text-align:center;font-weight:700;color:#1e3a8a;outline:none;background:#fff;padding:0}

/* ---------- верхние кнопки ---------- */
#fsBtn{position:fixed;top:12px;right:12px;width:54px;height:54px;border-radius:50%;border:none;background:#fff;box-shadow:var(--shadow);z-index:40;display:grid;place-items:center}
#fsBtn:active{transform:scale(.94)}
#timerPill{position:fixed;top:12px;left:12px;z-index:40;display:none;align-items:center;gap:8px;padding:8px 16px 8px 10px;border-radius:30px;border:none;
  background:#fff;box-shadow:var(--shadow);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
#timerPill .dot{width:22px;height:22px;border-radius:50%;background:var(--timer)}
#saveMark{position:fixed;top:72px;right:16px;z-index:39;font-size:12px;color:#16a34a;background:rgba(255,255,255,.85);padding:3px 8px;border-radius:10px;opacity:0;transition:opacity .4s;pointer-events:none}
#saveMark.on{opacity:1}

/* ---------- нижний док ---------- */
#dock{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;align-items:center;gap:6px;
  width:min(1320px,calc(100vw - 12px));pointer-events:none}
#dock>*{pointer-events:auto}
#panel{display:none;width:100%;max-height:44vh;overflow:auto;background:#fff;border-radius:20px;box-shadow:var(--shadow);border-top:6px solid var(--tc);
  padding:10px 12px 12px;touch-action:pan-x pan-y;scrollbar-width:thin}
#panel.open{display:block}
#tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tab{border:none;border-radius:16px;padding:9px 18px;font-size:17px;font-weight:700;color:#fff;box-shadow:0 4px 12px rgba(30,41,59,.15);display:flex;align-items:center;gap:8px;
  transition:transform .12s, box-shadow .12s;min-height:44px}
.tab .chev{font-size:12px;opacity:.85;transition:transform .2s}
.tab.active{transform:translateY(-3px);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--c),0 6px 16px rgba(30,41,59,.2)}
.tab.active.open .chev{transform:rotate(180deg)}
#toolbar{display:flex;align-items:center;gap:4px;background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:6px 8px;max-width:100%;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
#toolbar::-webkit-scrollbar{display:none}
.sep{width:2px;align-self:stretch;margin:6px 4px;background:var(--line);border-radius:2px;flex:none}
.tb{flex:none;width:60px;height:60px;border:none;border-radius:16px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:11px;font-weight:600;color:#334155;padding:0}
.tb svg{width:27px;height:27px}
.tb:hover{background:#f1f5f9}
.tb:active{transform:scale(.95)}
.tb.on{background:#dbeafe;color:#1d4ed8;box-shadow:inset 0 0 0 2px #93c5fd}
.tb.dis{opacity:.35;pointer-events:none}
.sw{flex:none;width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #cbd5e1;margin:0 2px;padding:0}
.sw.on{box-shadow:0 0 0 3px #1d4ed8}
#colorDot{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #94a3b8}
#dockShow{position:fixed;right:14px;bottom:14px;z-index:30;display:none;border:none;border-radius:20px;background:#fff;box-shadow:var(--shadow);padding:12px 18px;font-size:16px;font-weight:700;color:#334155}

/* ---------- панель предмета ---------- */
.groups{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.gbtn{border:none;border-radius:12px;padding:8px 14px;font-size:15px;font-weight:700;background:#f1f5f9;color:#334155;min-height:40px}
.gbtn.on{background:var(--tc);color:#fff}
.items{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.pitem{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:4px;padding:6px 6px 5px;min-width:80px;border-radius:14px;
  background:#f8fafc;border:2px solid #eef2f7;cursor:grab;touch-action:none}
.pitem:hover{border-color:var(--tc);background:#fff}
.pitem:active{cursor:grabbing}
.pitem canvas{display:block;pointer-events:none}
.pitem span{font-size:13px;font-weight:600;color:#334155;text-align:center;line-height:1.15;max-width:120px}
.inlineGroups{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.igroup{background:color-mix(in srgb,var(--tc) 9%,#fff);border-radius:16px;padding:8px 10px 10px;border:2px solid color-mix(in srgb,var(--tc) 30%,#fff)}
.igroup h3{margin:0 0 6px;font-size:16px;color:color-mix(in srgb,var(--tc) 75%,#000)}
.igroup .pitem{background:#fff}
.hint{font-size:13px;color:var(--muted);margin:6px 2px 0}
.kbdCol{display:flex;flex-direction:column;gap:6px;max-width:190px;align-self:center}
.kbdBtn{border:none;border-radius:14px;background:var(--tc);color:#fff;font-size:20px;font-weight:700;padding:10px 16px;align-self:center;min-height:56px}
.panelRow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.qlist{display:flex;flex-direction:column;gap:6px;margin-top:8px;max-width:760px}
.qrow{display:flex;gap:6px;align-items:center;background:#fdf2f8;border-radius:12px;padding:6px 8px}
.qrow .qt{flex:1;font-size:16px}
.btn{border:none;border-radius:12px;padding:9px 14px;font-size:15px;font-weight:700;background:#f1f5f9;color:#334155;min-height:42px}
.btn.pri{background:var(--tc);color:#fff}
.btn.sm{padding:6px 10px;min-height:36px;font-size:14px}
.btn:active{transform:scale(.97)}
.inp{border:2px solid #e2e8f0;border-radius:12px;padding:8px 10px;font-size:16px;min-height:42px;outline:none}
.inp:focus{border-color:var(--tc)}

/* ---------- таймер ---------- */
.tpanel{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.tring{position:relative;width:180px;height:180px;flex:none}
.tring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tring .tdisp{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;font-weight:800;font-variant-numeric:tabular-nums}
.tcol{display:flex;flex-direction:column;gap:8px}
.tset{display:flex;align-items:center;gap:6px}
.tset .num{width:70px;text-align:center;font-size:26px;font-weight:800}
.tquick{display:flex;gap:6px;flex-wrap:wrap}
.tquick .btn{min-width:56px}
.tbig .btn{font-size:18px;min-height:52px;padding:10px 18px}
.flash{animation:flash .5s 6}
@keyframes flash{50%{background:#fee2e2}}
#bigTimer{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:26;display:none;flex-direction:column;align-items:center;background:rgba(255,255,255,.96);
  border-radius:32px;box-shadow:var(--shadow);padding:12px 26px 22px;touch-action:none}
#bigTimer .bhead{align-self:stretch;display:flex;justify-content:space-between;align-items:center;cursor:move;gap:20px;font-weight:700;color:var(--muted)}
#bigTimer .tring{width:min(50vmin,460px);height:min(50vmin,460px)}
#bigTimer .bacts{display:flex;gap:10px;margin-top:10px}
#bigTimer .bacts .btn{font-size:20px;min-height:54px;padding:10px 22px}
#bigTimer .tdisp{font-size:min(15vmin,130px)}

/* ---------- всплывающие окна ---------- */
.pop{position:fixed;z-index:50;display:none;background:#fff;border-radius:20px;box-shadow:0 12px 40px rgba(30,41,59,.25);padding:14px;max-width:calc(100vw - 16px);max-height:70vh;overflow:auto;touch-action:pan-y}
.pop.open{display:block}
.pop h4{margin:4px 0 8px;font-size:15px;color:#334155}
.swgrid{display:grid;grid-template-columns:repeat(8,40px);gap:8px}
.swgrid .sw{width:40px;height:40px;margin:0}
.row{display:flex;align-items:center;gap:10px;margin:6px 0;flex-wrap:wrap}
.row label{min-width:150px;font-size:14px;font-weight:600;color:#475569}
.row input[type=range]{width:200px;accent-color:#3b82f6;touch-action:none}
.row .val{min-width:40px;font-weight:700;font-variant-numeric:tabular-nums}
.bgGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bgb{border:2px solid #e2e8f0;border-radius:14px;background:#fff;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:600}
.bgb.on{border-color:#3b82f6;background:#eff6ff}
.bgb canvas{border-radius:8px;border:1px solid #e2e8f0}
.menuList{display:flex;flex-direction:column;gap:6px;min-width:260px}
.menuList .btn{text-align:left;display:flex;align-items:center;gap:10px}
.about{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.4}

/* ---------- панель свойств ---------- */
#propsBar{position:fixed;z-index:28;display:none;flex-direction:column;gap:6px;background:#fff;border-radius:16px;box-shadow:0 8px 26px rgba(30,41,59,.22);padding:6px;max-width:min(96vw,760px)}
#propsBar .prow{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.pb{border:none;border-radius:11px;background:#f1f5f9;min-width:44px;height:44px;padding:0 10px;font-size:14px;font-weight:700;color:#334155;display:flex;align-items:center;justify-content:center;gap:6px}
.pb svg{width:22px;height:22px}
.pb.on{background:#3b82f6;color:#fff}
.pb.red{color:#dc2626}
.pb:active{transform:scale(.95)}
.plabel{font-size:13px;font-weight:700;color:#64748b;margin:0 2px 0 6px}
.pinp{width:110px;height:40px;border:2px solid #e2e8f0;border-radius:10px;padding:0 8px;font-size:15px;outline:none}
.pinp.n{width:64px;text-align:center}
.pinp:focus{border-color:#3b82f6}

/* ---------- якутская клавиатура ---------- */
#sakhaKbd{position:fixed;right:16px;top:90px;z-index:55;display:none;background:#fff;border-radius:18px;box-shadow:var(--shadow);border:3px solid var(--sakha);padding:6px 8px 10px;touch-action:none}
#sakhaKbd .khead{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;font-size:14px;color:#0f766e;cursor:move;padding:2px 2px 6px}
#sakhaKbd .keys{display:grid;grid-template-columns:repeat(5,54px);gap:6px}
#sakhaKbd .key{height:54px;border:none;border-radius:12px;background:#ccfbf1;color:#134e4a;font-size:28px;font-weight:700}
#sakhaKbd .key:active{background:var(--sakha);color:#fff}
.xbtn{border:none;background:#f1f5f9;border-radius:10px;width:34px;height:34px;font-size:18px;font-weight:700;color:#475569}

/* ---------- модальное окно, подсказки ---------- */
#modal{position:fixed;inset:0;z-index:80;background:rgba(15,23,42,.35);display:none;place-items:center}
#modal.open{display:grid}
#modal .card{background:#fff;border-radius:22px;padding:22px;max-width:420px;width:calc(100vw - 32px);box-shadow:var(--shadow)}
#modal .card p{font-size:18px;margin:0 0 18px;line-height:1.4}
#modal .acts{display:flex;gap:10px;justify-content:flex-end}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:90;background:#1e293b;color:#fff;padding:10px 18px;border-radius:14px;font-size:15px;font-weight:600;display:none;max-width:90vw;text-align:center}
#ghostLayer{position:fixed;inset:0;pointer-events:none;z-index:70}
#ghostLayer canvas{position:absolute;opacity:.85;filter:drop-shadow(0 6px 10px rgba(0,0,0,.2))}
@media (max-width:700px){
  .tb{width:52px;height:54px;font-size:10px}
  .tab{padding:7px 12px;font-size:15px;min-height:40px}
  .tring{width:140px;height:140px}
}
</style>
</head>
<body>
<div id="board">
  <canvas id="cvBg"></canvas>
  <canvas id="cvScene"></canvas>
  <canvas id="cvLive"></canvas>
  <textarea id="textEd" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
</div>
<button id="fsBtn" title="Полноэкранный режим" aria-label="Полноэкранный режим"></button>
<button id="timerPill" title="Открыть таймер"><span class="dot"></span><span class="tdisp">00:00</span></button>
<div id="saveMark">✓ сохранено</div>
<div id="bigTimer"><div class="bhead"><span>Таймер</span><button class="xbtn" id="bigClose" aria-label="Закрыть">✕</button></div><div class="tring big"></div><div class="bacts"><button class="btn pri tstart" style="--tc:#22C55E">▶ Старт</button><button class="btn" id="bigReset">↺ Сброс</button></div></div>
<div id="propsBar"></div>
<div id="sakhaKbd"><div class="khead"><span>Саха буукубалара</span><button class="xbtn" id="kbdClose" aria-label="Закрыть">✕</button></div><div class="keys"></div></div>
<div id="dock">
  <div id="panel"></div>
  <div id="tabs"></div>
  <div id="toolbar"></div>
</div>
<button id="dockShow">▲ Инструменты</button>
<div id="popColor" class="pop"></div>
<div id="popSize" class="pop"></div>
<div id="popBg" class="pop"></div>
<div id="popFile" class="pop"></div>
<div id="modal"><div class="card"><p id="modalText"></p><div class="acts"><button class="btn" id="modalNo">Отмена</button><button class="btn pri" id="modalYes" style="--tc:#ef4444">Да</button></div></div></div>
<div id="toast"></div>
<div id="ghostLayer"></div>
<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileLesson" accept=".json,.doska,application/json" hidden>
<script>
'use strict';
/* =====================================================================
   УМНАЯ ДОСКА — интерактивная доска для начальной школы
   Математика · Русский язык · Саха тыла · Рефлексия · Таймер
   Один автономный файл: HTML5 + CSS3 + JavaScript (Canvas, SVG, Pointer Events)
   ===================================================================== */

/* ---------- утилиты ---------- */
const $ = s => document.querySelector(s);
function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v === false || v == null) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()){
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
let _idc = 0;
const uid = () => 'o' + Date.now().toString(36) + (_idc++).toString(36) + Math.random().toString(36).slice(2, 6);
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
function segDist(px, py, x1, y1, x2, y2){
  const dx = x2 - x1, dy = y2 - y1, L = dx * dx + dy * dy;
  let t = L ? ((px - x1) * dx + (py - y1) * dy) / L : 0;
  t = clamp(t, 0, 1);
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}
function rrect(c, x, y, w, h, r){
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function hexToRgb(hex){
  hex = String(hex || '#000').replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(ch => ch + ch).join('');
  const n = parseInt(hex.slice(0, 6), 16) || 0;
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function hexA(hex, a){ const [r, g, b] = hexToRgb(hex); return `rgba(${r},${g},${b},${a})`; }
function shade(hex, k){ // k<0 темнее, k>0 светлее
  const [r, g, b] = hexToRgb(hex);
  const f = v => Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k);
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
function luminance(hex){ const [r, g, b] = hexToRgb(hex); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; }
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function animate(dur, step, done){
  const t0 = performance.now();
  function f(now){
    const t = clamp((now - t0) / dur, 0, 1);
    step(ease(t));
    if (t < 1) requestAnimationFrame(f); else if (done) done();
  }
  requestAnimationFrame(f);
}
function toast(msg, ms = 1800){
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', ms);
}
function askConfirm(text, yesLabel = 'Да'){
  return new Promise(res => {
    const m = $('#modal'); $('#modalText').textContent = text; $('#modalYes').textContent = yesLabel;
    m.classList.add('open');
    const done = v => { m.classList.remove('open'); $('#modalYes').onclick = $('#modalNo').onclick = null; res(v); };
    $('#modalYes').onclick = () => done(true);
    $('#modalNo').onclick = () => done(false);
  });
}

/* ---------- шрифты ---------- */
const FONT_UI = '"Segoe UI",Roboto,"Noto Sans","PT Sans","Helvetica Neue",Arial,sans-serif';
const FONTS = {
  sans:   { name: 'Печатный', css: FONT_UI },
  school: { name: 'Рукописный', css: '"Segoe Print","Comic Sans MS","Bradley Hand","Noto Sans",cursive' },
  serif:  { name: 'С засечками', css: '"PT Serif",Georgia,"Times New Roman","Noto Serif",serif' }
};

/* ---------- состояние ---------- */
const DEFAULT_QUESTIONS = [
  'Сегодня на уроке я узнал(а)…',
  'Мне было интересно…',
  'Мне было трудно…',
  'Я могу похвалить себя за…',
  'Бүгүн мин биллим…'
];
const S = {
  objects: [],
  sel: new Set(),
  tool: 'pen',
  color: '#1f2937',
  sizes: { pen: 4, feather: 10, marker: 24, eraser: 36, text: 40 },
  markerAlpha: 0.35,
  font: 'sans',
  bg: { pattern: 'none', color: 'white', custom: '#fff7e6', cell: 32, lineH: 34, rowGap: 30, slant: 65 },
  questions: DEFAULT_QUESTIONS.slice(),
  tab: null, panelOpen: false, groups: {}, dockHidden: false
};
const BG_COLORS = {
  white:  { name: 'Белая',        c: '#ffffff' },
  beige:  { name: 'Бежевая',      c: '#f7efdf' },
  blue:   { name: 'Голубая',      c: '#e4f1fd' },
  green:  { name: 'Школьная',     c: '#1f4b3a' },
  black:  { name: 'Чёрная',       c: '#16181d' },
  custom: { name: 'Свой цвет',    c: null }
};
const bgColor = () => S.bg.color === 'custom' ? S.bg.custom : (BG_COLORS[S.bg.color] || BG_COLORS.white).c;

/* ---------- холсты (слои) ---------- */
const board = $('#board');
const cvBg = $('#cvBg'), cvScene = $('#cvScene'), cvLive = $('#cvLive');
const cBg = cvBg.getContext('2d'), cScene = cvScene.getContext('2d'), cLive = cvLive.getContext('2d');
const inkCv = document.createElement('canvas'), cInk = inkCv.getContext('2d');   // слой рукописных записей
const measureCtx = document.createElement('canvas').getContext('2d');
let W = 0, H = 0, DPR = 1;
let bgDirty = true, sceneDirty = true, inkDirty = true, rafPending = false;

function resizeCanvases(){
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  for (const cv of [cvBg, cvScene, cvLive, inkCv]){
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  }
  bgDirty = sceneDirty = inkDirty = true;
  requestRender();
}
function requestRender(){
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(render);
}
function dirty(){ sceneDirty = true; requestRender(); }
function inkChanged(){ inkDirty = true; sceneDirty = true; requestRender(); }

/* ---------- фон ---------- */
function drawBackground(c, w, h, dpr){
  const B = S.bg, col = bgColor(), dark = luminance(col) < 0.45;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.fillStyle = col; c.fillRect(0, 0, w, h);
  const thin = dark ? 'rgba(255,255,255,.22)' : 'rgba(80,140,210,.30)';
  const main = dark ? 'rgba(255,255,255,.45)' : 'rgba(60,120,200,.55)';
  const slantC = dark ? 'rgba(255,255,255,.16)' : 'rgba(80,140,210,.22)';
  const line = (x1, y1, x2, y2) => { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); };
  c.lineCap = 'butt';
  const top = 24;
  switch (B.pattern){
    case 'grid': {
      const s = B.cell; c.strokeStyle = thin; c.lineWidth = 1;
      for (let x = (w / 2) % s; x < w; x += s) line(Math.round(x) + .5, 0, Math.round(x) + .5, h);
      for (let y = 0.5; y < h; y += s) line(0, y, w, y);
      break;
    }
    case 'narrow': case 'slant': case 'dotted': {
      const lh = B.lineH, gap = B.rowGap;
      if (B.pattern === 'slant'){
        const a = B.slant * Math.PI / 180, dx = h / Math.tan(a), step = Math.max(14, lh * 0.75);
        c.strokeStyle = slantC; c.lineWidth = 1;
        for (let x = -dx; x < w + step; x += step) line(x, h, x + dx, 0);
      }
      c.strokeStyle = main; c.lineWidth = 1.3;
      for (let y = top; y < h; y += lh + gap){
        line(0, y, w, y); line(0, y + lh, w, y + lh);
        if (B.pattern === 'dotted'){
          c.save(); c.setLineDash([6, 6]); c.strokeStyle = thin; c.lineWidth = 1.2;
          line(0, y + lh / 2, w, y + lh / 2); c.restore();
        }
      }
      break;
    }
    case 'wide': {
      const step = B.lineH + B.rowGap; c.strokeStyle = main; c.lineWidth = 1.3;
      for (let y = top + step; y < h; y += step) line(0, y, w, y);
      break;
    }
  }
}

/* ---------- рисование штрихов ---------- */
function strokePath(c, p){
  c.beginPath();
  c.moveTo(p[0][0], p[0][1]);
  if (p.length === 2){ c.lineTo(p[1][0], p[1][1]); return; }
  for (let i = 1; i < p.length - 1; i++){
    const mx = (p[i][0] + p[i + 1][0]) / 2, my = (p[i][1] + p[i + 1][1]) / 2;
    c.quadraticCurveTo(p[i][0], p[i][1], mx, my);
  }
  const l = p[p.length - 1]; c.lineTo(l[0], l[1]);
}
const prW = pr => 0.35 + 1.3 * pr;   // ширина от нажима стилуса
function drawStroke(c, o){
  const p = o.points; if (!p || !p.length) return;
  c.save(); c.lineCap = 'round'; c.lineJoin = 'round';
  c.strokeStyle = o.color; c.fillStyle = o.color;
  if (o.tool === 'feather') drawFeather(c, o);
  else if (o.tool === 'marker'){
    c.globalAlpha = o.alpha ?? 0.35; c.lineWidth = o.size;
    if (p.length === 1){ c.beginPath(); c.arc(p[0][0], p[0][1], o.size / 2, 0, 7); c.fill(); }
    else { strokePath(c, p); c.stroke(); }
  } else {
    if (p.length === 1){ c.beginPath(); c.arc(p[0][0], p[0][1], o.size / 2 * (o.pr ? prW(p[0][2]) : 1), 0, 7); c.fill(); }
    else if (o.pr){
      let px = p[0][0], py = p[0][1];
      for (let i = 1; i < p.length; i++){
        const last = i === p.length - 1;
        const mx = last ? p[i][0] : (p[i][0] + p[i + 1][0]) / 2, my = last ? p[i][1] : (p[i][1] + p[i + 1][1]) / 2;
        c.beginPath(); c.moveTo(px, py); c.quadraticCurveTo(p[i][0], p[i][1], mx, my);
        c.lineWidth = o.size * prW(p[i][2]); c.stroke(); px = mx; py = my;
      }
    } else { c.lineWidth = o.size; strokePath(c, p); c.stroke(); }
  }
  c.restore();
}
function chaikin(p){
  if (p.length < 3) return p;
  const out = [p[0]];
  for (let i = 0; i < p.length - 1; i++){
    const a = p[i], b = p[i + 1];
    out.push([a[0] * .75 + b[0] * .25, a[1] * .75 + b[1] * .25, a[2]]);
    out.push([a[0] * .25 + b[0] * .75, a[1] * .25 + b[1] * .75, b[2]]);
  }
  out.push(p[p.length - 1]);
  return out;
}
function drawFeather(c, o){ // каллиграфическое перо: плоский срез под 45°
  const p = chaikin(o.points), ang = -Math.PI / 4, nx = Math.cos(ang), ny = Math.sin(ang);
  const r = q => o.size / 2 * (o.pr ? prW(q[2]) : 1);
  c.lineWidth = 1.2;
  if (p.length === 1){
    const q = p[0], rr = r(q);
    c.beginPath(); c.moveTo(q[0] + nx * rr, q[1] + ny * rr); c.lineTo(q[0] - nx * rr, q[1] - ny * rr); c.lineWidth = 2.5; c.stroke(); return;
  }
  for (let i = 0; i < p.length - 1; i++){
    const a = p[i], b = p[i + 1], ra = r(a), rb = r(b);
    c.beginPath();
    c.moveTo(a[0] + nx * ra, a[1] + ny * ra); c.lineTo(b[0] + nx * rb, b[1] + ny * rb);
    c.lineTo(b[0] - nx * rb, b[1] - ny * rb); c.lineTo(a[0] - nx * ra, a[1] - ny * ra);
    c.closePath(); c.fill(); c.stroke();
  }
}
function updateStrokeBox(o){
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  for (const p of o.points){ if (p[0] < x1) x1 = p[0]; if (p[0] > x2) x2 = p[0]; if (p[1] < y1) y1 = p[1]; if (p[1] > y2) y2 = p[1]; }
  o.x = x1; o.y = y1; o.w = x2 - x1; o.h = y2 - y1;
}
function densify(pts, step = 3){
  if (pts.length < 2) return pts;
  const out = [pts[0]];
  for (let i = 1; i < pts.length; i++){
    const a = pts[i - 1], b = pts[i], d = dist(a[0], a[1], b[0], b[1]);
    if (d > step){ const n = Math.ceil(d / step); for (let k = 1; k < n; k++) out.push([lerp(a[0], b[0], k / n), lerp(a[1], b[1], k / n), lerp(a[2], b[2], k / n)]); }
    out.push(b);
  }
  return out;
}

/* ---------- текст ---------- */
const fontStr = o => `${o.bold ? '700 ' : ''}${o.size}px ${(FONTS[o.font] || FONTS.sans).css}`;
const textPad = o => o.bg ? Math.round(o.size * 0.45) : 0;
function layoutText(o){
  measureCtx.font = fontStr(o);
  const lines = String(o.text).split('\n'); let mw = 0;
  for (const l of lines) mw = Math.max(mw, measureCtx.measureText(l || ' ').width);
  const pad = textPad(o);
  o.w = Math.ceil(mw) + pad * 2 + 2;
  o.h = Math.ceil(lines.length * o.size * 1.25) + pad * 2;
}
function drawText(c, o){
  if (o._editing) return;
  const pad = textPad(o);
  c.save();
  if (o.bg){
    rrect(c, o.x, o.y, o.w, o.h, o.size * 0.4); c.fillStyle = o.bg; c.fill();
    c.lineWidth = 2; c.strokeStyle = 'rgba(0,0,0,.12)'; c.stroke();
  }
  c.font = fontStr(o); c.fillStyle = o.color; c.textBaseline = 'middle';
  String(o.text).split('\n').forEach((l, i) => c.fillText(l, o.x + pad + 1, o.y + pad + (i + 0.5) * o.size * 1.25));
  c.restore();
}

/* ---------- изображения ---------- */
const imgCache = new Map();
function getImg(src){
  let im = imgCache.get(src);
  if (!im){ im = new Image(); im.onload = () => dirty(); im.src = src; imgCache.set(src, im); }
  return im;
}

/* ---------- значки: цифры, буквы, ярлыки ---------- */
function drawGlyph(c, o){
  c.save(); c.fillStyle = o.color; c.font = `700 ${o.h * 0.86}px ${FONT_UI}`;
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(o.ch, o.x + o.w / 2, o.y + o.h * 0.54);
  c.restore();
}
function tagSize(text){ measureCtx.font = `700 22px ${FONT_UI}`; return { w: Math.ceil(measureCtx.measureText(text).width) + 30, h: 42 }; }
function drawTag(c, o){
  const k = o.h / 42;
  c.save();
  rrect(c, o.x + 1.5 * k, o.y + 1.5 * k, o.w - 3 * k, o.h - 3 * k, 12 * k);
  c.fillStyle = '#fff'; c.fill(); c.fillStyle = hexA(o.color, 0.16); c.fill();
  c.lineWidth = 2.5 * k; c.strokeStyle = o.color; c.stroke();
  c.fillStyle = shade(o.color, -0.25); c.font = `700 ${22 * k}px ${FONT_UI}`; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(o.text, o.x + o.w / 2, o.y + o.h / 2 + k);
  c.restore();
}

/* ---------- отрезки и стрелки (два конца) ---------- */
function arrowHead(c, x, y, ang, lw){
  const L = 10 + lw * 2.6, wd = 0.42;
  c.beginPath(); c.moveTo(x, y);
  c.lineTo(x - L * Math.cos(ang - wd), y - L * Math.sin(ang - wd));
  c.lineTo(x - L * Math.cos(ang + wd), y - L * Math.sin(ang + wd));
  c.closePath(); c.fill();
}
function drawSeg(c, o){
  c.save(); c.strokeStyle = o.color; c.fillStyle = o.color; c.lineWidth = o.lw; c.lineCap = 'round';
  const ang = Math.atan2(o.y2 - o.y1, o.x2 - o.x1), L = (10 + o.lw * 2.6) * 0.6;
  let x1 = o.x1, y1 = o.y1, x2 = o.x2, y2 = o.y2;
  if (o.kind !== 'segment'){ x2 -= Math.cos(ang) * L; y2 -= Math.sin(ang) * L; }
  if (o.kind === 'darrow'){ x1 += Math.cos(ang) * L; y1 += Math.sin(ang) * L; }
  c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
  if (o.kind === 'segment'){
    for (const [x, y] of [[o.x1, o.y1], [o.x2, o.y2]]){ c.beginPath(); c.arc(x, y, o.lw * 1.7 + 1, 0, 7); c.fill(); }
  } else {
    arrowHead(c, o.x2, o.y2, ang, o.lw);
    if (o.kind === 'darrow') arrowHead(c, o.x1, o.y1, ang + Math.PI, o.lw);
  }
  c.restore();
}

/* ---------- общий рендер объекта ---------- */
function drawObj(c, o){
  switch (o.type){
    case 'stroke': drawStroke(c, o); break;
    case 'text': drawText(c, o); break;
    case 'image': {
      const im = getImg(o.src);
      if (im.complete && im.naturalWidth) c.drawImage(im, o.x, o.y, o.w, o.h);
      else { c.fillStyle = '#e2e8f0'; c.fillRect(o.x, o.y, o.w, o.h); }
      break;
    }
    case 'seg': drawSeg(c, o); break;
    case 'glyph': drawGlyph(c, o); break;
    case 'tag': drawTag(c, o); break;
    case 'item': { const it = ITEMS[o.item]; if (!it) break; c.save(); c.translate(o.x, o.y); it.draw(c, o); c.restore(); break; }
    case 'widget': { const wd = WIDGETS[o.kind]; if (!wd) break; c.save(); c.translate(o.x, o.y); wd.draw(c, o); c.restore(); break; }
  }
}
const layerOf = o => o.type === 'image' ? 0 : o.type === 'stroke' ? 1 : o.type === 'text' ? 3 : 2;

function rebuildInk(){
  cInk.setTransform(1, 0, 0, 1, 0, 0); cInk.clearRect(0, 0, inkCv.width, inkCv.height);
  cInk.setTransform(DPR, 0, 0, DPR, 0, 0);
  for (const o of S.objects) if (o.type === 'stroke') drawStroke(cInk, o);
  inkDirty = false;
}
function drawSceneTo(c, dpr, ink){
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  for (const o of S.objects) if (o.type === 'image') drawObj(c, o);
  c.setTransform(1, 0, 0, 1, 0, 0); c.drawImage(ink, 0, 0);
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  for (const o of S.objects) if (layerOf(o) === 2) drawObj(c, o);
  for (const o of S.objects) if (o.type === 'text') drawObj(c, o);
}
function render(){
  rafPending = false;
  if (bgDirty){ drawBackground(cBg, W, H, DPR); bgDirty = false; }
  if (sceneDirty){
    if (inkDirty) rebuildInk();
    cScene.setTransform(1, 0, 0, 1, 0, 0); cScene.clearRect(0, 0, cvScene.width, cvScene.height);
    drawSceneTo(cScene, DPR, inkCv);
    sceneDirty = false;
  }
  drawLive();
}

/* =====================================================================
   КАТАЛОГ ФИГУР И ФИШЕК (рисуются в Canvas, без эмодзи)
   w,h — размер по умолчанию; keep — сохранять пропорции;
   mode: 'box' — рамка, 'h' — только длина; recolor — можно перекрасить
   ===================================================================== */
const C_RED = '#E31E24', C_GREEN = '#00A651', C_YELLOW = '#FFD400';
const lwOf = o => (o.props && o.props.lw) || 3;
function setStroke(c, o){ c.strokeStyle = o.color; c.fillStyle = o.color; c.lineWidth = lwOf(o); c.lineCap = 'round'; c.lineJoin = 'round'; }
const dashed = (c, on) => c.setLineDash(on ? [8, 6] : []);
function L(c, x1, y1, x2, y2){ c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); }
function circle(c, x, y, r){ c.beginPath(); c.arc(x, y, Math.max(0.5, r), 0, Math.PI * 2); }

/* --- линии подчёркивания: толщина и рисунок не зависят от длины --- */
function drawULine(c, o, kind){
  const w = o.w, cy = o.h / 2, lw = lwOf(o);
  c.strokeStyle = o.color; c.fillStyle = o.color; c.lineWidth = lw; c.lineJoin = 'round';
  const x0 = lw / 2 + 1, x1 = w - lw / 2 - 1;
  switch (kind){
    case 'single': c.lineCap = 'round'; L(c, x0, cy, x1, cy); break;
    case 'double': { c.lineCap = 'round'; const g = lw / 2 + 2.5; L(c, x0, cy - g, x1, cy - g); L(c, x0, cy + g, x1, cy + g); break; }
    case 'wave': {
      c.lineCap = 'round'; const wl = 16 + lw * 1.5, amp = 3 + lw * 0.7;
      c.beginPath(); c.moveTo(x0, cy);
      for (let x = x0; x <= x1; x += 1) c.lineTo(x, cy - amp * Math.sin((x - x0) / wl * Math.PI * 2));
      c.stroke(); break;
    }
    case 'dash': {
      c.lineCap = 'butt'; const d = 12 + lw * 1.5, g = 7 + lw;
      for (let x = 1; x < w - 1; x += d + g) L(c, x, cy, Math.min(x + d, w - 1), cy);
      break;
    }
    case 'dashdot': {
      c.lineCap = 'butt'; const d = 14 + lw * 1.5, g = 6 + lw * 0.6;
      let x = 1;
      while (x < w - 1){
        L(c, x, cy, Math.min(x + d, w - 1), cy); x += d + g;
        if (x + lw < w - 1){ circle(c, x + lw / 2, cy, lw * 0.62 + 0.4); c.fill(); }
        x += lw + g;
      }
      break;
    }
  }
}
const UL = kind => ({ w: 170, h: 26, mode: 'h', recolor: true, lw: 3, draw: (c, o) => drawULine(c, o, kind) });

/* --- 3D фигуры --- */
function drawBox3D(c, o){
  setStroke(c, o); const l = lwOf(o), x0 = l / 2, y0 = l / 2, w = o.w - l, h = o.h - l;
  const d = Math.min(w, h) * 0.3, dx = d, dy = d * 0.8;
  const F = { L: x0, T: y0 + dy, R: x0 + w - dx, B: y0 + h }, K = { L: x0 + dx, T: y0, R: x0 + w, B: y0 + h - dy };
  c.strokeRect(F.L, F.T, F.R - F.L, F.B - F.T);
  L(c, K.L, K.T, K.R, K.T); L(c, K.R, K.T, K.R, K.B);
  L(c, F.L, F.T, K.L, K.T); L(c, F.R, F.T, K.R, K.T); L(c, F.R, F.B, K.R, K.B);
  dashed(c, true); c.lineWidth = Math.max(1.5, l * 0.6);
  L(c, K.L, K.T, K.L, K.B); L(c, K.L, K.B, K.R, K.B); L(c, F.L, F.B, K.L, K.B);
  dashed(c, false);
}

/* --- предметы счёта и рефлексии --- */
function starPath(c, cx, cy, R, r){
  c.beginPath();
  for (let i = 0; i < 10; i++){
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r : R;
    c.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
  }
  c.closePath();
}
function heartPath(c, w, h){
  c.beginPath();
  c.moveTo(w / 2, h * 0.92);
  c.bezierCurveTo(w * 0.1, h * 0.62, -w * 0.02, h * 0.3, w * 0.22, h * 0.1);
  c.bezierCurveTo(w * 0.36, 0, w * 0.48, h * 0.08, w / 2, h * 0.25);
  c.bezierCurveTo(w * 0.52, h * 0.08, w * 0.64, 0, w * 0.78, h * 0.1);
  c.bezierCurveTo(w * 1.02, h * 0.3, w * 0.9, h * 0.62, w / 2, h * 0.92);
  c.closePath();
}
function face(c, o, mood){
  const s = Math.min(o.w, o.h), r = s / 2 - s * 0.04, cx = o.w / 2, cy = o.h / 2;
  circle(c, cx, cy, r); c.fillStyle = '#FFD43B'; c.fill(); c.lineWidth = s * 0.045; c.strokeStyle = '#E09F00'; c.stroke();
  c.fillStyle = '#3b2a14';
  circle(c, cx - r * 0.36, cy - r * 0.22, r * 0.11); c.fill();
  circle(c, cx + r * 0.36, cy - r * 0.22, r * 0.11); c.fill();
  c.strokeStyle = '#3b2a14'; c.lineWidth = s * 0.055; c.lineCap = 'round';
  c.beginPath();
  if (mood === 'happy') c.arc(cx, cy + r * 0.05, r * 0.5, 0.18 * Math.PI, 0.82 * Math.PI);
  else if (mood === 'sad') c.arc(cx, cy + r * 0.72, r * 0.45, 1.2 * Math.PI, 1.8 * Math.PI);
  else { c.moveTo(cx - r * 0.38, cy + r * 0.42); c.lineTo(cx + r * 0.38, cy + r * 0.42); }
  c.stroke();
  if (mood === 'happy'){ c.fillStyle = 'rgba(255,120,120,.35)'; circle(c, cx - r * 0.62, cy + r * 0.22, r * 0.13); c.fill(); circle(c, cx + r * 0.62, cy + r * 0.22, r * 0.13); c.fill(); }
}
function thumb(c, o, up){
  c.save();
  if (!up){ c.translate(o.w, o.h); c.rotate(Math.PI); }
  c.scale(o.w / 100, o.h / 100);
  const col = up ? '#22C55E' : '#EF4444', dk = up ? '#15803D' : '#B91C1C';
  c.lineJoin = 'round'; c.lineWidth = 3.5; c.strokeStyle = dk;
  rrect(c, 6, 44, 20, 50, 5); c.fillStyle = dk; c.fill();
  c.fillStyle = col;
  c.beginPath(); c.moveTo(32, 46); c.lineTo(46, 12); c.quadraticCurveTo(50, 3, 58, 8); c.quadraticCurveTo(64, 14, 60, 26); c.lineTo(56, 42); c.lineTo(32, 50); c.closePath(); c.fill(); c.stroke();
  rrect(c, 30, 42, 60, 52, 12); c.fill(); c.stroke();
  c.lineWidth = 3; L(c, 62, 56, 89, 56); L(c, 62, 69, 89, 69); L(c, 62, 82, 87, 82);
  c.restore();
}
function cloudShape(c, w, h, fill, stroke, lw){
  const blobs = [[0.27, 0.62, 0.24], [0.5, 0.42, 0.3], [0.74, 0.6, 0.24], [0.5, 0.7, 0.24]];
  const k = Math.min(w, h * 1.6);
  c.lineWidth = lw; c.strokeStyle = stroke;
  for (const [x, y, r] of blobs){ circle(c, x * w, y * h, r * k); c.stroke(); }
  c.fillStyle = fill;
  for (const [x, y, r] of blobs){ circle(c, x * w, y * h, r * k); c.fill(); }
}

const ITEMS = {
  /* ===== Саха тыла: дорҕооннор (одинаковая высота, прямоугольник = 2 × квадрат) ===== */
  s_close: { w: 46, h: 46, keep: true, draw(c, o){ c.fillStyle = C_GREEN; circle(c, o.w / 2, o.h / 2, Math.min(o.w, o.h) / 2); c.fill(); } },
  s_open:  { w: 46, h: 46, keep: true, draw(c, o){ c.fillStyle = C_RED; c.fillRect(0, 0, o.w, o.h); } },

/* =====================================================================
   ИНТЕРАКТИВНЫЕ ТРЕНАЖЁРЫ: числовой луч, числовой домик, часы, движение
   ===================================================================== */
function pbBtn(label, onclick, opts = {}){
  const b = el('button', { class: 'pb' + (opts.on ? ' on' : '') + (opts.cls ? ' ' + opts.cls : ''), title: opts.title || null, html: opts.html || null });
  if (!opts.html) b.textContent = label;
  b.addEventListener('pointerdown', e => e.stopPropagation());
  b.addEventListener('click', e => { e.stopPropagation(); onclick(e); });
  return b;
}
const pbLabel = t => el('span', { class: 'plabel' }, t);
function pbInput(value, oninput, opts = {}){
  const i = el('input', { class: 'pinp' + (opts.num ? ' n' : ''), value: value ?? '', type: 'text', inputmode: opts.num ? 'numeric' : null, placeholder: opts.ph || null });
  i.addEventListener('pointerdown', e => e.stopPropagation());
  i.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') i.blur(); });
  i.addEventListener('input', () => oninput(i.value, false));
  i.addEventListener('change', () => oninput(i.value, true));
  return i;
}
const fmt2 = n => String(n).padStart(2, '0');
const num = s => { const v = parseFloat(String(s).replace(',', '.')); return isFinite(v) ? v : NaN; };

function drawFrog(c, x, y){
  c.save(); c.translate(x, y);
  c.fillStyle = '#22A35A'; c.beginPath(); c.ellipse(-13, 13, 9, 5, 0, 0, 7); c.ellipse(13, 13, 9, 5, 0, 0, 7); c.fill();

/* ---------- окошко для ввода числа в домик ---------- */
function openCellEditor(o, cell){
  const s = o.w / WIDGETS.house.base;
  const inp = el('input', { class: 'cellEdit', type: 'text', inputmode: 'numeric', maxlength: '6' });
  inp.value = cell.v ?? '';
  Object.assign(inp.style, { left: (o.x + cell.x * s + 3) + 'px', top: (o.y + cell.y * s + 3) + 'px', width: (cell.w * s - 6) + 'px', height: (cell.h * s - 6) + 'px', fontSize: Math.max(16, 24 * s) + 'px' });
  document.body.append(inp);
  let done = false;
  const fin = () => {
    if (done) return; done = true;
    const v = inp.value.trim(); inp.remove();
    if (v !== String(cell.v ?? '')){ WIDGETS.house.setVal(o, cell.key, v); commit(); }
    dirty();
  };
  inp.addEventListener('blur', () => setTimeout(fin, 0));
  inp.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter' || e.key === 'Escape') inp.blur(); });
  setTimeout(() => { inp.focus(); inp.select(); }, 0);
}

/* =====================================================================
   ОБЪЕКТНАЯ МОДЕЛЬ: создание, выделение, перемещение, масштабирование
   ===================================================================== */
function makeProto(spec){
  if (spec.seg) return { type: 'seg', kind: spec.seg, x1: 0, y1: 0, x2: spec.len || 150, y2: 0, color: '#1f2937', lw: 3, _cur: true };
  if (spec.item){
    const it = ITEMS[spec.item];
    return { type: 'item', item: spec.item, x: 0, y: 0, w: it.w, h: it.h, color: spec.color || (it.recolor ? '#1f2937' : '#000000'), props: it.lw ? { lw: it.lw } : {}, _cur: !!it.recolor && !spec.color };
  }
  if (spec.glyph != null) return { type: 'glyph', ch: spec.glyph, x: 0, y: 0, w: /\d/.test(spec.glyph) ? 46 : 54, h: 64, color: spec.color || '#1f2937', _cur: !spec.color };
  if (spec.tag) return Object.assign({ type: 'tag', text: spec.tag, x: 0, y: 0, color: spec.color || '#6366F1' }, tagSize(spec.tag));
  if (spec.widget){
    const wd = WIDGETS[spec.widget];
    const o = { type: 'widget', kind: spec.widget, x: 0, y: 0, w: wd.w, h: wd.h, props: wd.init(spec) };
    if (spec.widget === 'house') o.h = wd.baseH(o.props) * o.w / wd.base;
    return o;
  }
  return null;
}
function instantiate(proto, cx, cy){
  const o = JSON.parse(JSON.stringify(proto));
  o.id = uid();
  if (proto._cur) o.color = S.color;
  delete o._cur;
  if (o.type === 'seg'){ const dx = cx - (o.x1 + o.x2) / 2, dy = cy - (o.y1 + o.y2) / 2; o.x1 += dx; o.x2 += dx; o.y1 += dy; o.y2 += dy; }

}
function cloneObj(o){ const c = Object.assign({}, o); if (o.props) c.props = JSON.parse(JSON.stringify(o.props)); return c; }
function bbox(o){

}

}
function resizeMode(o){

  if (o.type === 'seg') return 'pts';
  return 'box';
}
function keepRatio(o){
  if (o.type === 'item') return !!ITEMS[o.item].keep;
  if (o.type === 'widget') return !!WIDGETS[o.kind].keep;
  return true;
}
function canRecolor(o){
  if (o.type === 'item') return !!ITEMS[o.item].recolor;

}
function hasLw(o){ return o.type === 'seg' || (o.type === 'item' && !!ITEMS[o.item].lw); }
function hitObj(o, x, y, tol){
  if (o._editing) return false;

    const t = o.size / 2 + tol + 3;
    if (x < o.x - t || x > o.x + o.w + t || y < o.y - t || y > o.y + o.h + t) return false;
    const p = o.points; if (p.length === 1) return dist(x, y, p[0][0], p[0][1]) < t;
    for (let i = 0; i < p.length - 1; i++) if (segDist(x, y, p[i][0], p[i][1], p[i + 1][0], p[i + 1][1]) < t) return true;
    return false;

const selObjs = () => S.objects.filter(o => S.sel.has(o.id));

  const b = padBox(o), Lx = b.x, R = b.x + b.w, T = b.y, B = b.y + b.h, cx = Lx + b.w / 2, cy = T + b.h / 2;

function computeResize(b0, hid, dx, dy, keep, minS){

    }
    case 'text': o.size = clamp(orig.size * nb.h / Math.max(orig.h, 1), 8, 800); o.x = nb.x; o.y = nb.y; layoutText(o); break;
    case 'widget':
      if (o.kind === 'house'){ o.x = nb.x; o.y = nb.y; o.w = nb.w; o.h = WIDGETS.house.baseH(o.props) * nb.w / WIDGETS.house.base; break; }

function moveFrom(o, orig, dx, dy){

  else if (o.type === 'stroke'){ o.points = orig.points.map(q => [q[0] + dx, q[1] + dy, q[2]]); o.x = orig.x + dx; o.y = orig.y + dy; }

function scaleObj(o, f){

    o.x1 = mx + (o.x1 - mx) * f; o.x2 = mx + (o.x2 - mx) * f; o.y1 = my + (o.y1 - my) * f; o.y2 = my + (o.y2 - my) * f; return;

/* ---------- действия над выделением ---------- */
function duplicateSel(){
  const src = selObjs(); if (!src.length) return;
  const added = [];
  for (const o of src){ const n = cloneObj(o); n.id = uid(); moveFrom(n, cloneObj(n), 28, 28); added.push(n); }
  S.objects.push(...added); S.sel = new Set(added.map(o => o.id));
  if (added.some(o => o.type === 'stroke')) inkDirty = true;
  commit(); dirty(); buildProps();
}
function deleteSel(){
  if (!S.sel.size) return;
  const hadInk = selObjs().some(o => o.type === 'stroke');
  S.objects = S.objects.filter(o => !S.sel.has(o.id)); S.sel.clear();
  if (hadInk) inkDirty = true;
  commit(); dirty(); buildProps();
}
function reorderSel(front){
  const a = S.objects.filter(o => S.sel.has(o.id)), b = S.objects.filter(o => !S.sel.has(o.id));
  S.objects = front ? b.concat(a) : a.concat(b); inkDirty = true; commit(); dirty();
}
function scaleSel(f){ const a = selObjs(); for (const o of a) scaleObj(o, f); if (a.some(o => o.type === 'stroke')) inkDirty = true; commit(); dirty(); }

  for (const o of selObjs()){

  if (n){ inkDirty = true; commit(); dirty(); }
  return n;

/* =====================================================================
   УКАЗАТЕЛЬ: мышь, палец, стилус (Pointer Events)
   ===================================================================== */
let act = null, curStroke = null, eraserPos = null, lastPenTime = 0, lastTap = { id: null, t: 0 };

function eraseAt(x, y, r){
  let changed = false; const out = [];
  for (const o of S.objects){
    if (o.type !== 'stroke'){ out.push(o); continue; }
    const rr = r + o.size * 0.4;
    if (x < o.x - rr || x > o.x + o.w + rr || y < o.y - rr || y > o.y + o.h + rr){ out.push(o); continue; }
    const pieces = []; let cur = [], hit = false;
    for (const p of o.points){
      if ((p[0] - x) ** 2 + (p[1] - y) ** 2 < rr * rr){ hit = true; if (cur.length){ pieces.push(cur); cur = []; } }
      else cur.push(p);
    }
    if (!hit){ out.push(o); continue; }
    changed = true; if (cur.length) pieces.push(cur);
    for (const pc of pieces){
      if (pc.length < 2 && o.points.length > 1) continue;
      const n = Object.assign({}, o, { id: uid(), points: pc }); updateStrokeBox(n); out.push(n);
    }
  }
  if (changed){ S.objects = out; inkChanged(); }
  return changed;
}

  e.preventDefault();

  try { cvLive.setPointerCapture(e.pointerId); } catch (_){}
  const p = { x: e.clientX, y: e.clientY }, touch = e.pointerType === 'touch';

  if (e.pointerId !== act.id) return;
  e.preventDefault();
  switch (act.type){
    case 'draw': {
      const evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
      for (const ev of (evs.length ? evs : [e])){
        const pts = curStroke.points, last = pts[pts.length - 1], x = ev.clientX, y = ev.clientY;
        if (dist(last[0], last[1], x, y) < 1.1) continue;
        pts.push([x, y, curStroke.pr ? (ev.pressure || 0.5) : 0.5]);
      }
      requestRender(); break;
    }
    case 'erase': {
      const r = S.sizes.eraser / 2, d = dist(act.lx, act.ly, p.x, p.y), n = Math.max(1, Math.ceil(d / (r * 0.5)));
      for (let i = 1; i <= n; i++) if (eraseAt(lerp(act.lx, p.x, i / n), lerp(act.ly, p.y, i / n), r)) act.changed = true;
      act.lx = p.x; act.ly = p.y; eraserPos = p; requestRender(); break;
    }
    case 'move': {
      const dx = p.x - act.sx, dy = p.y - act.sy;
      if (!act.moved && Math.hypot(dx, dy) < 4) break;
      act.moved = true;
      for (const [o, orig] of act.origs) moveFrom(o, orig, dx, dy);
      if (act.origs.some(([o]) => o.type === 'stroke')) inkDirty = true;
      dirty(); break;
    }
    case 'resize': {
      const o = act.o, dx = p.x - act.sx, dy = p.y - act.sy;
      if (o.type === 'seg'){
        const k = act.hid === 'p1' ? 1 : 2, ox = k === 1 ? act.orig.x2 : act.orig.x1, oy = k === 1 ? act.orig.y2 : act.orig.y1;
        let nx = act.orig['x' + k] + dx, ny = act.orig['y' + k] + dy;
        const ang = Math.atan2(ny - oy, nx - ox) * 180 / Math.PI, a = ((ang % 90) + 90) % 90;
        if (a < 5 || a > 85){ if (Math.abs(nx - ox) > Math.abs(ny - oy)) ny = oy; else nx = ox; }   // притяжение к горизонтали и вертикали
        o['x' + k] = nx; o['y' + k] = ny;
      } else {
        const mode = resizeMode(o), keep = keepRatio(o) && mode !== 'h';
        const minS = o.type === 'widget' ? (WIDGETS[o.kind].minW || 90) : mode === 'h' ? 24 : 12;
        applyBox(o, act.orig, computeResize(act.b0, act.hid, dx, dy, keep, minS));
        if (o.type === 'stroke') inkDirty = true;
      }
      dirty(); break;
    }
    case 'marquee': act.x = p.x; act.y = p.y; requestRender(); break;
    case 'widget': act.ctrl.move(p.x - act.o.x, p.y - act.o.y, p.x, p.y); break;
  }
}
function onUp(e){
  if (!act || e.pointerId !== act.id) return;
  const a = act; act = null;
  const p = { x: e.clientX, y: e.clientY };
  switch (a.type){
    case 'draw': {
      const s = curStroke; curStroke = null;
      if (s){ s.points = densify(s.points, 3); updateStrokeBox(s); S.objects.push(s); inkChanged(); commit(); }
      break;
    }
    case 'erase': if (a.changed) commit(); if (e.pointerType === 'touch') eraserPos = null; break;
    case 'move':
      if (a.moved) commit();
      else if (a.dbl && e.type === 'pointerup') startTextEdit(a.dbl, false);
      break;
    case 'resize': commit(); break;
    case 'marquee': {
      const x = Math.min(a.sx, a.x), y = Math.min(a.sy, a.y), w = Math.abs(a.x - a.sx), h = Math.abs(a.y - a.sy);
      if (w > 5 || h > 5) S.sel = new Set(S.objects.filter(o => { const b = bbox(o); return b.x >= x && b.y >= y && b.x + b.w <= x + w && b.y + b.h <= y + h; }).map(o => o.id));
      break;
    }
    case 'widget': a.ctrl.end(p.x - a.o.x, p.y - a.o.y, p.x, p.y); break;
    case 'textTap': {
      if (e.type !== 'pointerup') break;
      const o = topHit(a.x, a.y, a.tol);
      if (o && o.type === 'text') startTextEdit(o, false);
      else {
        const t = { type: 'text', id: uid(), text: '', x: a.x, y: a.y - S.sizes.text * 0.62, size: S.sizes.text, color: S.color, font: S.font };
        layoutText(t); startTextEdit(t, true);
      }
      break;
    }
  }
  buildProps(); requestRender();
}

/* ---------- слой предпросмотра и выделения ---------- */
function drawLive(){
  const c = cLive;
  c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cvLive.width, cvLive.height);
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (curStroke) drawStroke(c, curStroke);
  const objs = selObjs();
  if (objs.length && !(act && act.type === 'draw')){
    c.save(); c.strokeStyle = '#2563EB'; c.lineWidth = 1.5; c.setLineDash([6, 4]);
    for (const o of objs){
      if (o.type === 'seg'){ c.beginPath(); c.moveTo(o.x1, o.y1); c.lineTo(o.x2, o.y2); c.lineWidth = o.lw + 10; c.strokeStyle = 'rgba(37,99,235,.18)'; c.setLineDash([]); c.stroke(); c.lineWidth = 1.5; c.strokeStyle = '#2563EB'; c.setLineDash([6, 4]); continue; }
      const b = padBox(o); c.strokeRect(b.x, b.y, b.w, b.h);
    }
    c.setLineDash([]);
    if (objs.length === 1){
      const one = objs[0], ln = resizeMode(one) === 'h' || one.type === 'seg';
      for (const hd of handlesOf(one)){
        c.beginPath();
        if (ln){ rrect(c, hd.x - 7, hd.y - 14, 14, 28, 7); } else c.arc(hd.x, hd.y, 9, 0, Math.PI * 2);
        c.fillStyle = '#fff'; c.fill(); c.lineWidth = 3; c.strokeStyle = '#2563EB'; c.stroke();
      }
    }
    c.restore();
  }
  if (act && act.type === 'marquee'){
    c.save(); c.fillStyle = 'rgba(59,130,246,.08)'; c.strokeStyle = '#3B82F6'; c.lineWidth = 1.5; c.setLineDash([5, 4]);
    const x = Math.min(act.sx, act.x), y = Math.min(act.sy, act.y), w = Math.abs(act.x - act.sx), h = Math.abs(act.y - act.sy);
    c.fillRect(x, y, w, h); c.strokeRect(x, y, w, h); c.restore();
  }
  if (S.ghostVal){
    const g = S.ghostVal; c.save(); circle(c, g.x, g.y, 24); c.fillStyle = 'rgba(37,99,235,.9)'; c.fill();
    txt(c, g.v, g.x, g.y + 1, 22, '#fff', 800); c.restore();
  }
  if (S.tool === 'eraser' && eraserPos){
    c.save(); c.beginPath(); c.arc(eraserPos.x, eraserPos.y, S.sizes.eraser / 2, 0, Math.PI * 2);
    c.fillStyle = 'rgba(255,255,255,.35)'; c.fill(); c.lineWidth = 2; c.strokeStyle = '#64748B'; c.setLineDash([4, 3]); c.stroke(); c.restore();
  }
  positionProps();
}

const textEd = $('#textEd');
let edit = null;
function startTextEdit(o, isNew){
  if (edit) commitText();
  S.sel.clear(); buildProps();
  edit = { o, isNew, orig: o.text };
  o._editing = true; dirty();
  const pad = textPad(o);
  Object.assign(textEd.style, {
    display: 'block', left: o.x + 'px', top: o.y + 'px', font: fontStr(o), lineHeight: '1.25', color: o.color,
    padding: pad + 'px', background: o.bg || 'rgba(255,255,255,.45)', borderRadius: o.bg ? (o.size * 0.4) + 'px' : '6px'
  });
  textEd.value = o.text;
  autosizeText();
  textEd.focus({ preventScroll: true });
  const n = textEd.value.length; textEd.setSelectionRange(n, n);
  lastField = textEd;
}
function autosizeText(){
  textEd.style.width = '20px'; textEd.style.height = '20px';
  textEd.style.width = Math.max(70, textEd.scrollWidth + 12) + 'px';
  textEd.style.height = textEd.scrollHeight + 'px';
}
function commitText(){
  if (!edit) return;
  const { o, isNew, orig } = edit; edit = null;
  const val = textEd.value.replace(/\s+$/, '');
  textEd.style.display = 'none';
  if (document.activeElement === textEd) textEd.blur();
  o._editing = false;
  if (!val.trim()){
    if (!isNew){ S.objects = S.objects.filter(q => q !== o); commit(); }
  } else {
    o.text = val; layoutText(o);
    if (isNew) S.objects.push(o);
    if (isNew || val !== orig) commit();
  }
  dirty();
}
textEd.addEventListener('input', autosizeText);
textEd.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Escape') commitText(); });
textEd.addEventListener('blur', () => setTimeout(() => { if (edit && document.activeElement !== textEd && !kbdHold) commitText(); }, 120));
textEd.addEventListener('pointerdown', e => e.stopPropagation());

/* ---------- вставка якутских букв в позицию курсора ---------- */
let lastField = null, kbdHold = false;
document.addEventListener('focusin', e => {
  const t = e.target;
  if ((t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && /^(text|search|number)?$/.test(t.type || ''))) && !t.readOnly) lastField = t;
});
function insertChar(ch){
  let f = document.activeElement;
  if (!f || !(f.tagName === 'TEXTAREA' || f.tagName === 'INPUT') || f.type === 'range' || f.type === 'color' || f.type === 'file') f = lastField && document.body.contains(lastField) && (lastField !== textEd || edit) ? lastField : null;
  if (!f){
    const t = { type: 'text', id: uid(), text: '', x: W / 2 - 40, y: (H - dockHeight()) / 2 - S.sizes.text / 2, size: S.sizes.text, color: S.color, font: S.font };
    layoutText(t); startTextEdit(t, true); f = textEd;
  }
  try {
    const st = f.selectionStart ?? f.value.length, en = f.selectionEnd ?? st;
    f.setRangeText(ch, st, en, 'end');
  } catch (_){ f.value += ch; }
  f.focus({ preventScroll: true });
  f.dispatchEvent(new Event('input', { bubbles: true }));
}

   ===================================================================== */
const Hist = { stack: [], idx: -1, max: 120 };
const snapshot = () => S.objects.map(cloneObj);
function commit(){
  Hist.stack = Hist.stack.slice(0, Hist.idx + 1);
  Hist.stack.push(snapshot());
  if (Hist.stack.length > Hist.max) Hist.stack.shift();
  Hist.idx = Hist.stack.length - 1;
  updateHistButtons(); scheduleSave();
}
function restore(snap){
  S.objects = snap.map(cloneObj);
  const ids = new Set(S.objects.map(o => o.id));
  S.sel = new Set([...S.sel].filter(id => ids.has(id)));
  inkChanged(); buildProps(); updateHistButtons(); scheduleSave();
}
function undo(){ if (edit) commitText(); if (Hist.idx <= 0) return; Hist.idx--; restore(Hist.stack[Hist.idx]); }
function redo(){ if (Hist.idx >= Hist.stack.length - 1) return; Hist.idx++; restore(Hist.stack[Hist.idx]); }

const serialize = () => JSON.parse(JSON.stringify(S.objects, (k, v) => (k && k[0] === '_') ? undefined : v));
function settingsData(){ return { tool: S.tool, color: S.color, sizes: S.sizes, markerAlpha: S.markerAlpha, font: S.font, bg: S.bg, questions: S.questions, sound: Timer.sound, groups: S.groups }; }
function sanitizeObjects(arr){
  if (!Array.isArray(arr)) return [];
  return arr.filter(o => o && typeof o === 'object' && o.type && (
    o.type !== 'item' || ITEMS[o.item]) && (o.type !== 'widget' || WIDGETS[o.kind]))
    .map(o => { o.id = o.id || uid(); if (o.type === 'text') layoutText(o); if (o.type === 'stroke') updateStrokeBox(o); return o; });
}
const Store = {
  db: null,
  open(){
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      try {
        const r = indexedDB.open('umnaya-doska', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => { this.db = r.result; res(r.result); };
        r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
        setTimeout(() => rej(new Error('timeout')), 2500);
      } catch (err){ rej(err); }
    });
  },
  async get(k){
    try { const db = await this.open(); return await new Promise((res, rej) => { const q = db.transaction('kv', 'readonly').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
    catch (_){ return null; }
  },
  async set(k, v){
    try { const db = await this.open(); await new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); return true; }
    catch (_){ return false; }
  }
};
let saveTimer = null, booted = false;
function scheduleSave(){ if (!booted) return; clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 700); }
async function saveNow(){
  clearTimeout(saveTimer);
  const data = { t: Date.now(), objects: serialize(), settings: settingsData() };
  const okDb = await Store.set('state', data);
  let okLs = false;
  try { localStorage.setItem('umnaya-doska', JSON.stringify(data)); okLs = true; }
  catch (_){ try { localStorage.setItem('umnaya-doska', JSON.stringify({ t: data.t, objects: data.objects.filter(o => o.type !== 'image'), settings: data.settings, partial: true })); } catch (__){} }
  if (okDb || okLs){ const m = $('#saveMark'); m.classList.add('on'); clearTimeout(saveNow._t); saveNow._t = setTimeout(() => m.classList.remove('on'), 900); }
}
async function loadSaved(){
  const a = await Store.get('state');
  let b = null; try { b = JSON.parse(localStorage.getItem('umnaya-doska') || 'null'); } catch (_){}
  if (a && b) return (b.t > a.t && !b.partial) ? b : a;
  return a || b;
}
function applySettings(st){
  if (!st) return;
  if (st.color) S.color = st.color;
  if (st.sizes) Object.assign(S.sizes, st.sizes);
  if (typeof st.markerAlpha === 'number') S.markerAlpha = st.markerAlpha;
  if (st.font && FONTS[st.font]) S.font = st.font;
  if (st.bg) Object.assign(S.bg, st.bg);
  if (Array.isArray(st.questions)) S.questions = st.questions.filter(q => typeof q === 'string');
  if (typeof st.sound === 'boolean') Timer.sound = st.sound;
  if (st.groups) S.groups = st.groups;
  if (st.tool) S.tool = st.tool;
}

/* =====================================================================
   БЕСКОНЕЧНОЕ КЛОНИРОВАНИЕ (как Infinite Cloner)
   ===================================================================== */
function protoBox(p){
  if (p.type === 'seg') return { w: Math.abs(p.x2 - p.x1), h: Math.max(p.lw * 7, 18) };
  return { w: p.w, h: p.h };
}
function renderProto(c, p, k, ox, oy){
  const b = protoBox(p);
  c.save(); c.translate(ox, oy); c.scale(k, k);
  const o = Object.assign(cloneObj(p), p.type === 'seg' ? { x1: 0, y1: b.h / 2, x2: b.w, y2: b.h / 2 } : { x: 0, y: 0 });
  drawObj(c, o); c.restore();
}
function protoCanvas(p, bw, bh, fit){
  const dpr = Math.min(window.devicePixelRatio || 1, 3), b = protoBox(p);
  const k = fit ? Math.min((bw - 8) / b.w, (bh - 8) / b.h, 1.15) : 1;
  const cv = document.createElement('canvas');
  cv.width = Math.round(bw * dpr); cv.height = Math.round(bh * dpr); cv.style.width = bw + 'px'; cv.style.height = bh + 'px';
  const c = cv.getContext('2d'); c.scale(dpr, dpr);
  renderProto(c, p, k, (bw - b.w * k) / 2, (bh - b.h * k) / 2);
  return cv;
}
function paletteItem(spec){
  const proto = makeProto(spec);
  const isLine = proto.type === 'seg' || (proto.type === 'item' && ITEMS[proto.item].mode === 'h');
  const big = proto.type === 'widget' || (proto.type === 'item' && /^f_(ladder|tree|basket|traffic)$/.test(proto.item));
  const bw = isLine ? 112 : big ? 104 : 72, bh = isLine ? 30 : big ? 64 : 52;
  const box = el('div', { class: 'pitem', title: spec.label || '', role: 'button', 'aria-label': spec.label || 'Элемент' }, protoCanvas(proto, bw, bh, true), spec.label ? el('span', null, spec.label) : null);
  attachCloner(box, spec);
  return box;
}
let tapCascade = 0;
function attachCloner(node, spec){
  node.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    e.preventDefault();
    if (edit) commitText();
    closePops();
    const proto = makeProto(spec), st = { x: e.clientX, y: e.clientY, moved: false, ghost: null, id: e.pointerId };
    try { node.setPointerCapture(e.pointerId); } catch (_){}
    const mv = ev => {
      if (ev.pointerId !== st.id) return;
      if (!st.moved && dist(ev.clientX, ev.clientY, st.x, st.y) > 6){
        st.moved = true; const b = protoBox(proto);
        st.ghost = protoCanvas(proto, b.w + 10, b.h + 10, false); st.gw = b.w + 10; st.gh = b.h + 10;
        $('#ghostLayer').append(st.ghost);
      }
      if (st.ghost){ st.ghost.style.left = (ev.clientX - st.gw / 2) + 'px'; st.ghost.style.top = (ev.clientY - st.gh / 2) + 'px'; }
    };
    const up = ev => {
      if (ev.pointerId !== st.id) return;
      node.removeEventListener('pointermove', mv); node.removeEventListener('pointerup', up); node.removeEventListener('pointercancel', up);
      if (st.ghost) st.ghost.remove();
      if (ev.type === 'pointercancel') return;
      if (st.moved){
        const tgt = document.elementFromPoint(ev.clientX, ev.clientY);
        if (tgt === cvLive) placeProto(proto, ev.clientX, ev.clientY);
      } else {
        const n = tapCascade++ % 8;
        placeProto(proto, W / 2 + (n - 3.5) * 26, (H - dockHeight()) / 2 + (n - 3.5) * 18);
      }
    };
    node.addEventListener('pointermove', mv); node.addEventListener('pointerup', up); node.addEventListener('pointercancel', up);
  });
}
function placeProto(proto, cx, cy){
  const o = instantiate(proto, cx, cy);
  S.objects.push(o);
  S.sel = new Set([o.id]);
  if (S.tool !== 'select'){ S.tool = 'select'; refreshToolbar(); }
  commit(); dirty(); buildProps();
}

    const r2 = el('div', { class: 'prow' }), r3 = el('div', { class: 'prow' });
    WIDGETS[one.kind].props(one, r2, r3);
    propsBar.append(r2); if (r3.childNodes.length) propsBar.append(r3);
  }
  propsBar.dataset.has = '1';
  positionProps();
}
function positionProps(){
  if (!propsBar.dataset.has){ propsBar.style.display = 'none'; return; }
  if (act && (act.type === 'move' || act.type === 'resize' || act.type === 'marquee')){ propsBar.style.display = 'none'; return; }
  const objs = selObjs(); if (!objs.length){ propsBar.style.display = 'none'; return; }
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  for (const o of objs){ const b = padBox(o); x1 = Math.min(x1, b.x); y1 = Math.min(y1, b.y); x2 = Math.max(x2, b.x + b.w); y2 = Math.max(y2, b.y + b.h); }
  propsBar.style.display = 'flex';
  const pw = propsBar.offsetWidth, ph = propsBar.offsetHeight;
  let x = (x1 + x2) / 2 - pw / 2, y = y1 - ph - 16;
  if (y < 70) y = y2 + 16;
  if (y + ph > H - dockHeight()) y = Math.max(70, Math.min(y1 - ph - 16, H - dockHeight() - ph - 6));
  x = clamp(x, 8, W - pw - 8); y = clamp(y, 8, H - ph - 8);
  propsBar.style.left = x + 'px'; propsBar.style.top = y + 'px';
}

function addImageFile(file, at){
  if (!file || !/^image\//.test(file.type)) return;
  const r = new FileReader();
  r.onload = () => {
    const im = new Image();
    im.onload = () => {
      const MAX = 1800; let w = im.naturalWidth, h = im.naturalHeight, src = r.result;
      if (Math.max(w, h) > MAX || file.size > 1.5e6){
        const k = Math.min(1, MAX / Math.max(w, h)); const cv = document.createElement('canvas');
        cv.width = Math.round(w * k); cv.height = Math.round(h * k); cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
        src = /png|gif|webp|svg/.test(file.type) ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg', 0.88);
        w = cv.width; h = cv.height;
      }
      const availH = H - dockHeight() - 40, k2 = Math.min(1, (W * 0.6) / w, (availH * 0.75) / h);
      const o = { type: 'image', id: uid(), src, x: 0, y: 0, w: Math.round(w * k2), h: Math.round(h * k2) };
      const cx = at ? at.x : W / 2, cy = at ? at.y : (H - dockHeight()) / 2;
      o.x = Math.round(cx - o.w / 2); o.y = Math.round(cy - o.h / 2);
      S.objects.push(o); S.sel = new Set([o.id]); setTool('select'); S.sel = new Set([o.id]);
      commit(); dirty(); buildProps();
    };
    im.src = r.result;
  };
  r.readAsDataURL(file);
}

/* =====================================================================
   ТАЙМЕР И СЕКУНДОМЕР
   ===================================================================== */
const Timer = { mode: 'down', total: 5 * 60000, remain: 5 * 60000, running: false, endAt: 0, startAt: 0, elapsed: 0, sound: true, finished: false, big: false };
let audioCtx = null;
function beep(){
  if (!Timer.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime;
    for (let i = 0; i < 4; i++){
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = i % 2 ? 660 : 880;
      g.gain.setValueAtTime(0.0001, t0 + i * 0.35); g.gain.exponentialRampToValueAtTime(0.4, t0 + i * 0.35 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * 0.35 + 0.3);
      o.connect(g).connect(audioCtx.destination); o.start(t0 + i * 0.35); o.stop(t0 + i * 0.35 + 0.32);
    }
  } catch (_){}
}
function tNow(){ return Timer.mode === 'down' ? (Timer.running ? Math.max(0, Timer.endAt - Date.now()) : Timer.remain) : (Timer.running ? Date.now() - Timer.startAt : Timer.elapsed); }
function tFmt(ms){
  const up = Timer.mode === 'up', s = up ? Math.floor(ms / 1000) : Math.ceil(ms / 1000);
  const m = Math.floor(s / 60), r = s % 60;
  return (m >= 60 ? Math.floor(m / 60) + ':' + fmt2(m % 60) : fmt2(m)) + ':' + fmt2(r);
}
function tColor(ms){
  if (Timer.mode === 'up') return '#3B82F6';
  const f = Timer.total ? ms / Timer.total : 0;
  return f > 0.5 ? '#22C55E' : f > 0.2 ? '#F59E0B' : '#EF4444';
}
function tStart(){
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume && audioCtx.resume(); } catch (_){}
  if (Timer.running) return;
  if (Timer.mode === 'down'){ if (Timer.remain <= 0) Timer.remain = Timer.total; if (Timer.remain <= 0) return; Timer.endAt = Date.now() + Timer.remain; }
  else Timer.startAt = Date.now() - Timer.elapsed;
  Timer.running = true; Timer.finished = false; updateTimerViews(true);
}
function tPause(){
  if (!Timer.running) return;
  if (Timer.mode === 'down') Timer.remain = Math.max(0, Timer.endAt - Date.now()); else Timer.elapsed = Date.now() - Timer.startAt;
  Timer.running = false; updateTimerViews(true);
}
function tReset(){ Timer.running = false; Timer.finished = false; Timer.remain = Timer.total; Timer.elapsed = 0; updateTimerViews(true); }
function tSet(ms){ Timer.mode = 'down'; Timer.running = false; Timer.finished = false; Timer.total = Timer.remain = clamp(ms, 0, 99 * 60000 + 59000); renderTimerControls(); updateTimerViews(true); }
setInterval(() => {
  if (!Timer.running) return;
  if (Timer.mode === 'down' && Date.now() >= Timer.endAt){
    Timer.running = false; Timer.remain = 0; Timer.finished = true; beep();
    document.querySelectorAll('.tring').forEach(r => { r.classList.remove('flash'); void r.offsetWidth; r.classList.add('flash'); });
    toast('Время вышло!', 3000);
  }
  updateTimerViews();
}, 200);
function ringSVG(){
  return `<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="#f1f5f9" stroke-width="12"/><circle class="tprog" cx="60" cy="60" r="52" fill="none" stroke="#22C55E" stroke-width="12" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="0"/></svg><div class="tdisp">00:00</div>`;
}
function updateTimerViews(){
  const ms = tNow(), txtv = tFmt(ms), col = tColor(ms);
  const frac = Timer.mode === 'down' ? (Timer.total ? ms / Timer.total : 0) : ((ms / 1000) % 60) / 60;
  document.querySelectorAll('.tdisp').forEach(d => { d.textContent = txtv; d.style.color = Timer.mode === 'down' && Timer.finished ? '#EF4444' : '#1f2937'; });
  document.querySelectorAll('.tprog').forEach(c => { c.setAttribute('stroke', col); c.setAttribute('stroke-dashoffset', String(326.7 * (1 - frac))); });
  const pill = $('#timerPill'), active = Timer.running || (Timer.mode === 'down' ? (Timer.remain < Timer.total || Timer.finished) : Timer.elapsed > 0);
  const timerOpen = S.panelOpen && S.tab === 'timer';

  $('#bigTimer').style.display = Timer.big ? 'flex' : 'none';
}

}

  $('#dockShow').addEventListener('click', () => setDockHidden(false));
  $('#timerPill').addEventListener('click', () => { S.tab = 'timer'; S.panelOpen = true; setDockHidden(false); renderPanel(); });
  $('#bigClose').addEventListener('click', () => { Timer.big = false; updateTimerViews(); });
  $('#bigTimer .tstart').addEventListener('click', () => Timer.running ? tPause() : tStart());
  $('#bigReset').addEventListener('click', tReset);
  makeDraggable($('#bigTimer'), $('#bigTimer .bhead'));
  $('#fileImg').addEventListener('change', e => { addImageFile(e.target.files[0]); e.target.value = ''; });
  $('#fileLesson').addEventListener('change', e => { if (e.target.files[0]) openLessonFile(e.target.files[0]); e.target.value = ''; });
  board.addEventListener('dragover', e => e.preventDefault());
  board.addEventListener('drop', e => {
    e.preventDefault(); const f = e.dataTransfer && e.dataTransfer.files[0]; if (!f) return;
    if (/^image\//.test(f.type)) addImageFile(f, { x: e.clientX, y: e.clientY });
    else if (/json|doska/.test(f.name)) openLessonFile(f);
  });
  document.addEventListener('paste', e => {
    if (e.target.closest && e.target.closest('input,textarea')) return;
    const it = [...(e.clipboardData ? e.clipboardData.items : [])].find(i => i.type.startsWith('image/'));
    if (it){ e.preventDefault(); addImageFile(it.getAsFile()); }
  });
  document.addEventListener('keydown', e => {
    if (e.target.closest('input,textarea')) return;
    const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
    if (mod && (k === 'z' || k === 'я')){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if (mod && (k === 'y' || k === 'н')){ e.preventDefault(); redo(); }
    else if (mod && (k === 'd' || k === 'в')){ e.preventDefault(); duplicateSel(); }
    else if (k === 'delete' || k === 'backspace'){ if (S.sel.size){ e.preventDefault(); deleteSel(); } }
    else if (k === 'escape'){ S.sel.clear(); buildProps(); closePops(); requestRender(); }
    else if (k.startsWith('arrow') && S.sel.size){
      e.preventDefault(); const st = e.shiftKey ? 10 : 1, dx = k === 'arrowleft' ? -st : k === 'arrowright' ? st : 0, dy = k === 'arrowup' ? -st : k === 'arrowdown' ? st : 0;
      for (const o of selObjs()) moveFrom(o, cloneObj(o), dx, dy);
      inkDirty = true; dirty(); clearTimeout(bindGlobal._nt); bindGlobal._nt = setTimeout(commit, 400);
    }
  });
  window.addEventListener('pagehide', () => { if (edit) commitText(); saveNow(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
}
async function boot(){
  resizeCanvases();
  $('#bigTimer .tring').innerHTML = ringSVG();
  bindGlobal(); buildKbd();
  let saved = null;
  try { saved = await loadSaved(); } catch (_){}
  if (saved){ applySettings(saved.settings); S.objects = sanitizeObjects(saved.objects); }
  buildToolbar(); buildTabs(); renderPanel(); updateFsIcon();
  commit(); booted = true;
  bgDirty = true; inkChanged();
  if (!saved) toast('Добро пожаловать! Выберите вкладку внизу и перетаскивайте элементы на доску.', 3500);
}
boot();

</script>
